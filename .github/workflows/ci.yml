name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
